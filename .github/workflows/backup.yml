# Nightly encrypted backup of the Supabase database and storage files to Cloudflare R2.
# Setup and restore instructions: docs/BACKUP.md
#
# This repo is PUBLIC: workflow logs are visible to everyone. Nothing in this job may print
# table contents or file names, and the backup is never stored as a GitHub artifact.

name: Backup Supabase

on:
  schedule:
    - cron: "30 1 * * *" # every day 01:30 UTC (03:30/04:30 Israel time)
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL_S3: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      # Newer AWS CLI versions send checksum headers that R2 may reject.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Check secrets are set
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL BACKUP_AGE_PUBLIC_KEY \
                      R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name (see docs/BACKUP.md)"; missing=1; fi
          done
          if [ "$AWS_ENDPOINT_URL_S3" = "https://.r2.cloudflarestorage.com" ]; then
            echo "::error::Missing secret R2_ACCOUNT_ID"; missing=1
          fi
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump database (roles, schema, data)
        run: |
          mkdir -p backup/db
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/db/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/db/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/db/data.sql
          ls -la backup/db

      - name: Download storage files
        run: node scripts/backup-storage.mjs backup/storage

      - name: Pack and encrypt
        run: |
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          tar -czf - -C backup . | age -r "$BACKUP_AGE_PUBLIC_KEY" -o "ama-backup-$STAMP.tar.gz.age"
          rm -rf backup
          ls -la "ama-backup-$STAMP.tar.gz.age"

      - name: Upload to R2
        run: |
          FILE="ama-backup-$STAMP.tar.gz.age"
          aws s3 cp "$FILE" "s3://$R2_BUCKET/daily/$FILE" --only-show-errors
          # Sundays: also keep a weekly copy (kept longer by the R2 lifecycle rules).
          if [ "$(date -u +%u)" = "7" ]; then
            aws s3 cp "$FILE" "s3://$R2_BUCKET/weekly/$FILE" --only-show-errors
          fi
          echo "Uploaded $FILE"
